# General
editor = "nvim"

# System settings
workspace_location = "~/Projects"     # Workspace root: always indexed, and where `import` clones projects
index_folders = ["~/work/*"]           # Additional glob patterns indexed alongside workspace_location
cache_interval = 300

# Display
home_icon = "~"  # Icon to represent home directory in list view
default_sort_by = "newest"  # Options: newest, oldest, a-z, z-a

# UI
list_spacing = "space" # Options: compact, tight, space

# Colors
[colors]
headings = "15"
primary = "02"
secondary = "06"
text = "07"
text_highlight = "06"
description_highlight = "05"
tags = "13"
flags = "12"
muted = "08"
border = "08"
error = "01"
title = "02"
highlight_border = "02"
name = "07"
highlight_name = "06"
tasks = "06"
progress_bg = "08"
progress_fg = "02"
highlight_progress_bg = "08"
highlight_progress_fg = "06"
rainbow = false # Enable rainbow colors for projects (boolean true/false or array of color hex codes)

# Todo & Project Settings
ignore_folders = ["node_modules", "dist", "bin", ".git", ".vscode", "vendor", "build", "target", "pkg", ".venv"]
show_taskless = true
open_with_tmux = false
fts_files = ["plan/tasks.md", "plan/simple.md", "todo.md", "tasks.md", "PLAN.md"]
fts_features = ["## Feature ", "### Feature "]
fts_tasks = ["- [ ] ", "* [ ] "]
fts_subtasks = ["- [ ] ", "* [ ] "]
todo_tokens = ["TODO", "FIXME"]
parallel = 8  # Repositories processed at once by `pull` and `import` (override with --jobs/-j)
sync_interval = 3600  # Seconds between project scans. Set to 0 to always rescan. Press 's' to force sync.
