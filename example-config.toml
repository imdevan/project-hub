# General
editor = "nvim"

# CLI behavior
interactive_default = false
confirm_delete = true

# System settings
shell = "zsh"                          # Options: bash, zsh, fish, nu (auto-detected if not specified)
index_folders = ["~/Projects/*"]       # Glob patterns to scan for projects to index
cache_interval = 300
script_icons = {}

# Display
home_icon = "~"  # Icon to represent home directory in list view
default_sort_by = "newest"  # Options: newest, oldest, a-z, z-a

# UI
list_spacing = "space" # Options: compact, tight, space

# Colors
headings = "15"
primary = "02"
secondary = "06"
text = "07"
text_highlight = "06"
description_highlight = "05"
tags = "13"
flags = "12"
muted = "08"
border = "08"
error = "01"
color_title = "02"
color_highlight_border = "02"
color_name = "07"
color_highlight_name = "06"
color_tasks = "06"
color_progress_bg = "08"
color_progress_fg = "02"
color_highlight_progress_bg = "08"
color_highlight_progress_fg = "06"
rainbow = false # Enable rainbow colors for projects (boolean true/false or array of color hex codes)

# Todo & Project Settings
ignore_folders = ["node_modules", "dist", "bin", ".git", ".vscode", "vendor", "build", "target", "pkg", ".venv"]
show_taskless = false
fts_files = ["plan/tasks.md", "plan/simple.md", "todo.md", "tasks.md", "PLAN.md"]
fts_features = ["## Feature ", "### Feature "]
fts_tasks = ["- [ ] ", "* [ ] "]
fts_subtasks = ["- [ ] ", "* [ ] "]
todo_tokens = ["TODO", "FIXME"]
sync_interval = 3600  # Seconds between project scans. Set to 0 to always rescan. Press 's' to force sync.
daily_reset = "04:20" # Time of day to reset daily.md checkboxes (HH:MM format)
weekly_reset = "monday" # Day of week for weekly.md reset at daily_reset time
exit_with_alias = false # When true, output cd command on selection exit for shell eval
